<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Frankie's Garage</title>
  <meta name="description" content="A calm speech-practice app with cartoon Mom and Dad, using your own voices.">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Garage">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="homeBtn" class="icon-btn" aria-label="Home">🏠</button>
      <div id="topTitle"></div>
      <button id="lockBtn" class="icon-btn lock" aria-label="Grown-ups: press and hold for 3 seconds">
        <svg viewBox="0 0 60 60" class="lock-ring"><circle cx="30" cy="30" r="26" class="ring-bg"/><circle cx="30" cy="30" r="26" class="ring-fg"/></svg>
        <span>⚙️</span>
      </button>
      <button id="doneBtn" class="pill-btn hidden">Done ✓</button>
    </header>

    <main id="screens">
      <!-- HOME -->
      <section id="screen-home" class="screen active">
        <div class="home-hero">
          <h1 id="homeTitle">Frankie's Garage</h1>
          <div id="homeFamily" class="home-family"></div>
        </div>
        <div class="home-cards">
          <button class="home-card" data-go="say"><span class="hc-icon">🎬</span><span class="hc-label">Say it with me</span></button>
          <button class="home-card" data-go="finish"><span class="hc-icon">👂</span><span class="hc-label">Finish it</span></button>
          <button class="home-card" data-go="words"><span class="hc-icon">🚗</span><span class="hc-label">Word garage</span></button>
        </div>
      </section>

      <!-- SAY IT / FINISH IT -->
      <section id="screen-play" class="screen">
        <div class="stage-slot" data-slot="play"></div>
        <div class="play-controls">
          <button id="againBtn" class="again-btn" aria-label="Play again">▶</button>
          <div id="phraseStrip" class="strip"></div>
        </div>
      </section>

      <!-- WORD GARAGE -->
      <section id="screen-words" class="screen">
        <div class="stage-slot small" data-slot="words"></div>
        <div class="words-bar">
          <div class="seg">
            <button id="mode1" class="seg-btn active">1 word</button>
            <button id="mode2" class="seg-btn">2 words</button>
          </div>
          <div id="sentence" class="sentence"></div>
        </div>
        <div id="wordGrid" class="word-grid"></div>
      </section>

      <!-- ALL DONE (session timer) -->
      <section id="screen-alldone" class="screen">
        <div class="stage-slot" data-slot="alldone"></div>
        <div class="alldone-msg">All done! 👋</div>
      </section>

      <!-- PARENT -->
      <section id="screen-parent" class="screen">
        <nav id="parentTabs" class="tabs"></nav>
        <div id="parentBody" class="parent-body"></div>
      </section>
    </main>

    <!-- shared stage overlay controls (moved with the stage) -->
    <div id="stageHost" class="stage-host">
      <button id="saidBtn" class="said-btn">👍 <span id="saidName">Frankie</span> said it!</button>
      <div id="waitBar" class="wait-bar"><div></div></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
